name: release

# Tag drives the version, so the package and the tag can never disagree, will override version from .csproj:
#   git tag 3.0.0 && git push origin 3.0.0
#
# Three numbers and no prefix, which is how every tag in this repository is spelled. A v prefixed one is taken
# as well, because the version step below already strips a v and a trigger that refused what that step handles
# is the quiet failure this is written to avoid: 2.0.0 and 2.1.0 both matched nothing, so the tag went up, no
# run started, and nothing said so.
#
# Requires matching policy on nuget.org
#   Repository Owner  rvoisin-mcl
#   Repository        Weequery
#   Workflow File     release.yml        (this file, by name, so only this workflow can publish)
#   Environment       (empty)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job level, so the token can only be minted here. Restating contents:read because a job level block replaces
    # the workflow level one rather than adding to it.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The strip is what lets both spellings in the trigger arrive here as the same number
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.value }}

      # Nothing is published that has not passed, so a bad tag costs a failed run rather than a listed package
      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release

      # The solution rather than a list of projects, so a package added later is released without anyone
      # remembering to add it here. Tests is the only thing in it that is not packable and marks itself so.
      #
      # One version for all of them: -p:Version is a global property, so the companion packages take it too and
      # each one's dependency on Weequery is pinned to the same number it was built alongside.
      - name: Pack
        run: >
          dotnet pack Weequery.sln
          --no-build
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error

      # As key is short-lived ask for it immediately prior to push.
      - name: NuGet login (OIDC, for a short lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Run from inside artifacts, and match on the file name alone: the wildcard is resolved by NuGet rather
      # than the shell, and it only matches within the working directory. "artifacts/*.nupkg" is not expanded
      # and fails with "File does not exist".
      #
      # Pushing the .nupkg sends the matching .snupkg beside it. --skip-duplicate so re-running a finished
      # release is not an error; nuget.org refuses to overwrite a published version either way.
      - name: Push to nuget.org
        working-directory: artifacts
        run: >
          dotnet nuget push "*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
